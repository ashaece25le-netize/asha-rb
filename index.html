
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Chatbot</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #e8efff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            transition: 0.3s;
        }

        .chatbox {
            width: 350px;
            max-width: calc(100vw - 56px);
            background: white;
            padding: 20px;
            border-radius: 18px;
            box-shadow: 0 5px 20px #0002;
        }

        h2 {
            color: #4f46e5;
            text-align: center;
        }

        #messages {
            height: 300px;
            overflow-y: auto;
            padding: 10px;
            background: #f8fafc;
            border-radius: 10px;
        }

        .user {
            background: #dbeafe;
            padding: 10px;
            border-radius: 10px;
            text-align: right;
            overflow-wrap: anywhere;
        }

        .bot {
            background: #dcfce7;
            padding: 10px;
            border-radius: 10px;
            overflow-wrap: anywhere;
        }

        .controls {
            display: flex;
            gap: 6px;
            margin-top: 12px;
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            cursor: pointer;
        }

        .extra {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
        }

        /* Dark mode */
        body.dark {
            background: #111827;
        }

        body.dark .chatbox {
            background: #1f2937;
            color: white;
        }

        body.dark #messages {
            background: #374151;
        }

        body.dark .user {
            background: #1e40af;
            color: white;
        }

        body.dark .bot {
            background: #166534;
            color: white;
        }
    </style>
</head>

<body>

    <div class="chatbox">
        <h2>🤖 Smart Chatbot</h2>

        <div id="messages" aria-live="polite">
            <p class="bot">Bot: Hello! Ask me something.</p>
        </div>

        <div class="controls">
            <input id="userInput" type="text"
                   placeholder="Type your message..."
                   aria-label="Your message">

            <button onclick="sendMessage()">Send</button>
        </div>

        <div class="extra">
            <button onclick="clearChat()">🧹 Clear</button>
            <button onclick="toggleDark()">🌙 Dark Mode</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById("userInput");
            const message = input.value.trim();

            if (message === "") return;

            const messages = document.getElementById("messages");

            // Show user message
            const userMsg = document.createElement("p");
            userMsg.className = "user";
            userMsg.textContent = "You: " + message;
            messages.appendChild(userMsg);

            const text = message.toLowerCase();
            let reply;

            // Choose bot reply
            if (text.includes("hello") || text.includes("hi")) {
                reply = "Hello! 👋 Nice to meet you.";
            } else if (text.includes("how are you")) {
                reply = "I am doing great! How are you?";
            } else if (text.includes("your name")) {
                reply = "My name is Smart Chatbot 🤖.";
            } else if (text.includes("time")) {
                reply = "The current time is " +
                    new Date().toLocaleTimeString() + ".";
            } else if (text.includes("date")) {
                reply = "Today's date is " +
                    new Date().toLocaleDateString() + ".";
            } else if (text.includes("study")) {
                reply = "Study a little every day. You can do it! 📚";
            } else if (text.includes("joke")) {
                reply = "Why did the computer get cold? It left its Windows open! 😂";
            } else if (text.includes("thank")) {
                reply = "You're welcome! 😊";
            } else if (text.includes("bye")) {
                reply = "Goodbye! Have a wonderful day. 👋";
            } else {
                reply = "I don't know that yet. Try asking about my name, time, date, or a joke!";
            }

            // Show bot reply
            const botMsg = document.createElement("p");
            botMsg.className = "bot";
            botMsg.textContent = "Bot: " + reply;
            messages.appendChild(botMsg);

            messages.scrollTop = messages.scrollHeight;
            input.value = "";
            input.focus();
        }

        // Send using Enter key
        document.getElementById("userInput")
            .addEventListener("keydown", function(event) {
                if (event.key === "Enter") {
                    sendMessage();
                }
            });

        // Clear all messages
        function clearChat() {
            document.getElementById("messages").innerHTML = "";
        }

        // Switch between light and dark mode
        function toggleDark() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
